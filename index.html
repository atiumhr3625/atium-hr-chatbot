<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>에이티움 HR 도우미</title>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HR 도우미">
<meta name="theme-color" content="#1e40af">
<link rel="apple-touch-icon" href="atium_chatbot_icon.png">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;background:#f1f5f9;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;}
#wrap{display:flex;flex-direction:column;height:720px;width:700px;border:1px solid #e2e8f0;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 4px 24px rgba(0,0,0,0.08);}
#hdr{padding:14px 18px;border-bottom:1px solid #e2e8f0;background:linear-gradient(135deg,#1e40af,#3b82f6);display:flex;align-items:center;gap:12px;flex-shrink:0;}
#hdr-icon{width:44px;height:44px;flex-shrink:0;filter:drop-shadow(0 2px 6px rgba(29,78,216,0.35));}
#hdr-info{flex:1;}
#hdr-title{font-size:16px;font-weight:700;color:#fff;}
#hdr-sub{font-size:11.5px;color:rgba(255,255,255,0.8);margin-top:2px;}

/* 설치 버튼 */
#install-btn{display:none;align-items:center;gap:6px;padding:7px 13px;background:rgba(255,255,255,0.22);border:1px solid rgba(255,255,255,0.45);border-radius:20px;color:#fff;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background 0.15s;flex-shrink:0;}
#install-btn:hover{background:rgba(255,255,255,0.32);}
#install-btn.show{display:flex;}

/* iOS 설치 안내 배너 */
#ios-banner{display:none;position:fixed;bottom:0;left:0;right:0;background:#1e40af;color:#fff;padding:14px 20px;font-size:13px;line-height:1.6;z-index:999;text-align:center;}
#ios-banner b{display:block;font-size:14px;margin-bottom:4px;}
#ios-close{margin-top:8px;display:inline-block;padding:5px 18px;border:1px solid rgba(255,255,255,0.5);border-radius:12px;cursor:pointer;font-size:12px;}

#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;}
.msg-bot{display:flex;gap:9px;align-items:flex-start;}
.bot-av{width:32px;height:32px;border-radius:50%;flex-shrink:0;margin-top:2px;overflow:hidden;}
.bot-bbl{background:#f1f5f9;border-radius:0 12px 12px 12px;padding:11px 15px;font-size:13.5px;color:#334155;line-height:1.65;max-width:88%;}
.msg-user{display:flex;justify-content:flex-end;}
.user-bbl{background:#3b82f6;color:#fff;border-radius:12px 0 12px 12px;padding:10px 15px;font-size:13.5px;line-height:1.6;max-width:80%;}
.widget{padding-left:41px;}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px 0;}
.cat-btn{padding:10px 13px;border:1px solid #e2e8f0;border-radius:10px;background:#fff;cursor:pointer;font-size:13px;color:#334155;text-align:left;transition:all 0.15s;display:flex;align-items:center;gap:7px;font-weight:500;}
.cat-btn:hover{background:#eff6ff;border-color:#93c5fd;color:#1d4ed8;}
.sub-list{display:flex;flex-direction:column;gap:7px;padding:4px 0;}
.sub-btn{padding:10px 14px;border:1px solid #e2e8f0;border-radius:10px;background:#f8fafc;cursor:pointer;font-size:13px;color:#334155;text-align:left;transition:all 0.15s;font-weight:500;display:flex;align-items:center;gap:7px;}
.sub-btn:hover{background:#eff6ff;border-color:#93c5fd;color:#1d4ed8;}
.q-list{display:flex;flex-direction:column;gap:7px;padding:4px 0;}
.q-btn{padding:9px 13px;border:1px solid #e2e8f0;border-radius:9px;background:#fff;cursor:pointer;font-size:13px;color:#334155;text-align:left;transition:all 0.15s;line-height:1.45;}
.q-btn:hover{background:#eff6ff;border-color:#93c5fd;}
.nav-btns{display:flex;gap:7px;margin-top:2px;flex-wrap:wrap;}
.back-btn{padding:6px 13px;border:1px solid #cbd5e1;border-radius:8px;background:#f8fafc;cursor:pointer;font-size:12px;color:#64748b;display:inline-flex;align-items:center;gap:4px;}
.back-btn:hover{background:#f1f5f9;border-color:#94a3b8;}
.answer-box{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:12px 15px;font-size:13.5px;color:#14532d;line-height:1.75;}
.info-box{background:#fefce8;border:1px solid #fde68a;border-radius:8px;padding:9px 13px;font-size:12px;color:#78350f;margin-top:7px;line-height:1.6;}
</style>
</head>
<body>

<div id="wrap">
  <div id="hdr">
    <svg id="hdr-icon" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="iconBg" cx="38%" cy="32%" r="68%">
          <stop offset="0%" stop-color="#60a5fa"/>
          <stop offset="100%" stop-color="#1d4ed8"/>
        </radialGradient>
        <radialGradient id="bubbleGrad" cx="35%" cy="28%" r="65%">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="100%" stop-color="#eff6ff"/>
        </radialGradient>
        <radialGradient id="shineGrad" cx="28%" cy="18%" r="68%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="blushL" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fda4af" stop-opacity="0.85"/>
          <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="blushR" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fda4af" stop-opacity="0.85"/>
          <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
        </radialGradient>

        </filter>
        <filter id="bubbleShadow" x="-10%" y="-10%" width="125%" height="135%">
          <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#3b82f6" flood-opacity="0.2"/>
        </filter>
      </defs>
      <rect x="12" y="12" width="488" height="488" rx="116" fill="url(#iconBg)" filter="url(#softShadow)"/>
      <ellipse cx="155" cy="112" rx="148" ry="88" fill="url(#shineGrad)"/>
      <rect x="22" y="22" width="468" height="468" rx="108" fill="none" stroke="#93c5fd" stroke-width="3" opacity="0.35"/>
      <g filter="url(#bubbleShadow)">
        <rect x="64" y="110" width="368" height="246" rx="62" fill="url(#bubbleGrad)"/>
        <path d="M136 356 Q110 408 78 430 Q144 412 174 368" fill="url(#bubbleGrad)"/>
      </g>
      <ellipse cx="176" cy="218" rx="23" ry="26" fill="#1d4ed8" opacity="0.88"/>
      <ellipse cx="184" cy="208" rx="8" ry="8" fill="white" opacity="0.75"/>
      <ellipse cx="314" cy="218" rx="23" ry="26" fill="#1d4ed8" opacity="0.88"/>
      <ellipse cx="322" cy="208" rx="8" ry="8" fill="white" opacity="0.75"/>
      <path d="M192 272 Q245 316 298 272" stroke="#2563eb" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.75"/>
      <ellipse cx="136" cy="268" rx="36" ry="22" fill="url(#blushL)"/>
      <ellipse cx="352" cy="268" rx="36" ry="22" fill="url(#blushR)"/>
      <line x1="394" y1="64" x2="394" y2="100" stroke="#fde68a" stroke-width="5" stroke-linecap="round"/>
      <line x1="376" y1="82" x2="412" y2="82" stroke="#fde68a" stroke-width="5" stroke-linecap="round"/>
      <line x1="428" y1="106" x2="428" y2="126" stroke="#fde68a" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="418" y1="116" x2="438" y2="116" stroke="#fde68a" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="70" y1="76" x2="70" y2="98" stroke="#bae6fd" stroke-width="4" stroke-linecap="round"/>
      <line x1="59" y1="87" x2="81" y2="87" stroke="#bae6fd" stroke-width="4" stroke-linecap="round"/>
      <circle cx="436" cy="424" r="11" fill="#93c5fd" opacity="0.55"/>
      <circle cx="458" cy="400" r="6.5" fill="#bfdbfe" opacity="0.45"/>
    </svg>
    <div id="hdr-info">
      <div id="hdr-title">에이티움 HR 도우미</div>
      <div id="hdr-sub">임직원 문의 응대 시스템 · 에이티움 전용</div>
    </div>
    <!-- 설치 버튼 (Android/Chrome 자동 표시) -->
    <button id="install-btn" onclick="installApp()">⬇ 앱 설치</button>
  </div>
  <div id="msgs"></div>
</div>

<!-- iOS 설치 안내 배너 -->
<div id="ios-banner">
  <b>📲 홈 화면에 추가하는 방법</b>
  Safari 하단 공유 버튼(□↑) 누르고 → "홈 화면에 추가" 선택
  <div id="ios-close" onclick="document.getElementById('ios-banner').style.display='none'">닫기</div>
</div>

<script>
// ══════════════════════════════════════════════════════
//  PWA 설치
// ══════════════════════════════════════════════════════
let deferredPrompt = null;

// Android/Chrome: 설치 프롬프트 대기
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('install-btn').classList.add('show');
});

// 설치 완료 시 버튼 숨기기
window.addEventListener('appinstalled', () => {
  document.getElementById('install-btn').classList.remove('show');
  deferredPrompt = null;
});

function installApp() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => {
      deferredPrompt = null;
      document.getElementById('install-btn').classList.remove('show');
    });
  }
}

// iOS Safari 감지 → 배너 표시
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isInStandaloneMode = window.navigator.standalone === true;
if (isIOS && !isInStandaloneMode) {
  document.getElementById('ios-banner').style.display = 'block';
}

// ══════════════════════════════════════════════════════
//  GOOGLE SHEETS 연동 설정
// ══════════════════════════════════════════════════════
const SHEET_API_KEY = 'AIzaSyBxVKofJ9iGFFOZZVNZ3HfhlJbYij9s-NA';
const SHEET_ID      = '1KQuKpjGLAoLV00_btBrXbv3QZ3C63DtgKAAEM52_Rjk';
const SHEET_NAME    = 'HR Chatbot DB';

const TRACKER_URL = 'https://script.google.com/macros/s/AKfycbykKdkmsWyRwLBoPTwjzZH434SEIi_j2eChqZKBIF96sIBWxE6Ym0nT7S3z0t7corVR/exec';

function trackEvent(eventType, category='', subCategory='', question='') {
  if (!TRACKER_URL || TRACKER_URL.startsWith('YOUR_')) return;
  try {
    fetch(TRACKER_URL, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ eventType, category, subCategory, question })
    });
  } catch(e) {}
}

async function loadFromGoogleSheets(){
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(SHEET_NAME)}?key=${SHEET_API_KEY}`;
  try {
    const res = await fetch(url);
    if(!res.ok){
      const errJson = await res.json().catch(()=>({}));
      throw new Error(`API 오류 ${res.status}: ${errJson.error?.message || res.statusText}`);
    }
    const json = await res.json();
    const rows = json.values || [];
    if(rows.length < 2){ addBot('❌ 시트에 데이터가 없습니다.'); return; }

    const headers = rows[0];
    const colIdx = {
      cat:  headers.indexOf('대카테고리'),
      sub:  headers.indexOf('소카테고리'),
      q:    headers.indexOf('질문'),
      a:    headers.indexOf('답변'),
      info: headers.indexOf('담당자정보'),
    };
    const missing = Object.entries(colIdx).filter(([k,v])=>k!=='info'&&v===-1).map(([k])=>k);
    if(missing.length){ addBot(`❌ 필수 컬럼 누락: ${missing.join(', ')}`); return; }

    const catsMap = new Map();
    rows.slice(1).forEach(row => {
      const catRaw   = (row[colIdx.cat]||'').trim();
      const subLabel = (row[colIdx.sub]||'').trim();
      const q        = (row[colIdx.q]||'').trim();
      const a        = (row[colIdx.a]||'').trim();
      const info     = colIdx.info >= 0 ? (row[colIdx.info]||'').trim() : '';
      if(!catRaw||!subLabel||!q||!a) return;

      const iconMatch = catRaw.match(/^(\p{Emoji}[\ufe0f\u20e3]?)\s*(.+)$/u);
      const catIcon   = iconMatch ? iconMatch[1] : '';
      const catLabel  = iconMatch ? iconMatch[2].trim() : catRaw;

      if(!catsMap.has(catLabel)){
        catsMap.set(catLabel, { id: catLabel.replace(/[^a-zA-Z0-9가-힣]/g,'_'), icon:catIcon, label:catLabel, subsMap:new Map() });
      }
      const cat = catsMap.get(catLabel);
      if(catIcon) cat.icon = catIcon;
      if(!cat.subsMap.has(subLabel)) cat.subsMap.set(subLabel, {label:subLabel, qs:[]});
      const qObj = {q, a};
      if(info) qObj.info = info;
      cat.subsMap.get(subLabel).qs.push(qObj);
    });

    const newData = {cats:[]};
    catsMap.forEach(cat => {
      const subs = []; cat.subsMap.forEach(sub => subs.push(sub));
      newData.cats.push({id:cat.id, icon:cat.icon, label:cat.label, subs});
    });
    if(!newData.cats.length){ addBot('❌ 유효한 데이터가 없습니다.'); return; }

    DATA = newData;
    state='cats'; curCatIdx=null; curSubIdx=null;
    $m().innerHTML='';
    const totalQs = newData.cats.reduce((s,c)=>s+c.subs.reduce((ss,sub)=>ss+sub.qs.length,0),0);
    addBot(`안녕하세요! <b>에이티움 HR 도우미</b>입니다. 👋<br><b>${newData.cats.length}개</b> 카테고리 · <b>${totalQs}개</b> 질문이 준비되어 있습니다.<br>아래 카테고리에서 궁금한 항목을 선택해 주세요.`);
    showCats();
  } catch(err){
    console.error(err);
    addBot('❌ 데이터 로드 실패: ' + err.message);
  }
}

// ══════════════════════════════════════════════════════
//  CHATBOT STATE
// ══════════════════════════════════════════════════════
let state = 'cats';
let curCatIdx = null;
let curSubIdx = null;
let DATA = { cats: [] };

function $m(){ return document.getElementById('msgs'); }

const BOT_AVATAR_SVG = `<svg viewBox="0 0 512 512" style="width:32px;height:32px;border-radius:50%;" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="av_bg" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#60a5fa"/><stop offset="100%" stop-color="#1d4ed8"/>
    </radialGradient>
    <radialGradient id="av_bbl" cx="35%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#eff6ff"/>
    </radialGradient>
    <radialGradient id="av_bl" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fda4af" stop-opacity="0.85"/><stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="av_br" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fda4af" stop-opacity="0.85"/><stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="av_sh" cx="28%" cy="18%" r="68%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="12" y="12" width="488" height="488" rx="116" fill="url(#av_bg)"/>
  <ellipse cx="155" cy="112" rx="148" ry="88" fill="url(#av_sh)"/>
  <rect x="64" y="110" width="368" height="246" rx="62" fill="url(#av_bbl)"/>
  <path d="M136 356 Q110 408 78 430 Q144 412 174 368" fill="url(#av_bbl)"/>
  <ellipse cx="176" cy="218" rx="23" ry="26" fill="#1d4ed8" opacity="0.88"/>
  <ellipse cx="184" cy="208" rx="8" ry="8" fill="white" opacity="0.75"/>
  <ellipse cx="314" cy="218" rx="23" ry="26" fill="#1d4ed8" opacity="0.88"/>
  <ellipse cx="322" cy="208" rx="8" ry="8" fill="white" opacity="0.75"/>
  <path d="M192 272 Q245 316 298 272" stroke="#2563eb" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.75"/>
  <ellipse cx="136" cy="268" rx="36" ry="22" fill="url(#av_bl)"/>
  <ellipse cx="352" cy="268" rx="36" ry="22" fill="url(#av_br)"/>
</svg>`;

function addBot(html){
  const d = document.createElement('div');
  d.className = 'msg-bot';
  d.innerHTML = `<div class="bot-av">${BOT_AVATAR_SVG}</div><div class="bot-bbl">${html}</div>`;
  $m().appendChild(d);
  $m().scrollTop = $m().scrollHeight;
}
function addUser(text){
  const d = document.createElement('div');
  d.className = 'msg-user';
  d.innerHTML = `<div class="user-bbl">${text}</div>`;
  $m().appendChild(d);
  $m().scrollTop = $m().scrollHeight;
}
function addWidget(html){
  const d = document.createElement('div');
  d.className = 'widget';
  d.innerHTML = html;
  $m().appendChild(d);
  $m().scrollTop = $m().scrollHeight;
}

function showCats(){
  state='cats'; curCatIdx=null; curSubIdx=null;
  let g = '<div class="cat-grid">';
  DATA.cats.forEach((c,i)=>{
    g += `<button class="cat-btn" onclick="selectCat(${i})">${c.icon||''} ${c.label}</button>`;
  });
  g += '</div>';
  addWidget(g);
}

function selectCat(i){
  curCatIdx=i; state='subs';
  const cat = DATA.cats[i];
  trackEvent('cat_click', cat.label);
  addUser(`${cat.icon||''} ${cat.label}`);
  addBot(`<b>${cat.label}</b> 관련 항목을 선택해 주세요.`);
  let html = `<button class="back-btn" onclick="showCats()">← 카테고리로</button>`;
  html += `<div class="sub-list" style="margin-top:8px">`;
  cat.subs.forEach((s,j)=>{
    html += `<button class="sub-btn" onclick="selectSub(${j})">${s.label}</button>`;
  });
  html += `</div>`;
  addWidget(html);
}

function selectSub(j){
  curSubIdx=j; state='qs';
  const cat = DATA.cats[curCatIdx];
  const sub = cat.subs[j];
  trackEvent('sub_click', cat.label, sub.label);
  addUser(sub.label);
  addBot(`<b>${sub.label}</b> 관련 자주 묻는 질문입니다.`);
  let html = `<div class="nav-btns"><button class="back-btn" onclick="selectCat(${curCatIdx})">← 소카테고리로</button><button class="back-btn" onclick="showCats()">🏠 카테고리로</button></div>`;
  html += `<div class="q-list" style="margin-top:8px">`;
  sub.qs.forEach((q,k)=>{
    html += `<button class="q-btn" onclick="selectQ(${k})">${q.q}</button>`;
  });
  html += `</div>`;
  addWidget(html);
}

function selectQ(k){
  state='ans';
  const cat = DATA.cats[curCatIdx];
  const sub = cat.subs[curSubIdx];
  const q   = sub.qs[k];
  trackEvent('q_click', cat.label, sub.label, q.q);
  addUser(q.q);
  let aHtml = `<div class="answer-box">${q.a.replace(/\n/g,'<br>')}</div>`;
  if(q.info) aHtml += `<div class="info-box">ℹ️ ${q.info.replace(/\n/g,'<br>')}</div>`;
  addBot(aHtml);
  addWidget(`<div class="nav-btns">
    <button class="back-btn" onclick="selectSub(${curSubIdx})">← 다른 질문 보기</button>
    <button class="back-btn" onclick="selectCat(${curCatIdx})">↩ 소카테고리로</button>
    <button class="back-btn" onclick="showCats()">🏠 카테고리로</button>
  </div>`);
}

// ── Init ──
addBot(`안녕하세요! <b>에이티움 HR 도우미</b>입니다. 👋<br>데이터를 불러오는 중입니다...`);
loadFromGoogleSheets();
</script>
</body>
</html>
